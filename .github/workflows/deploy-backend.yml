# 手动发布后端到开发环境：在 Actions 页面选择分支后点击 Run workflow。
# 复用 backend/deploy-dev.sh；配置说明见 backend/readme.md。
# 生产服务器在国内，GitHub runner 跨境上传发布包会超时，生产在本机执行 backend/deploy-prod.sh。
# 仓库公开，运行日志所有人可见：服务器地址、用户名与密钥只放 Environment secrets。
name: Deploy backend

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend-dev
  cancel-in-progress: false

env:
  # 发布号与服务器 release 目录按时间戳命名，与本机发布保持同一时区
  TZ: Asia/Shanghai
  HOST_ALIAS: chasingpoints-dev

jobs:
  deploy:
    name: dev · ${{ github.ref_name }}
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Environment dev 缺少 secret $name"
              exit 1
            fi
          done
          install -d -m 700 ~/.ssh
          (umask 077; printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key)
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # 复用同一条 SSH 连接，减少逐次握手超时
          cat > ~/.ssh/config <<EOF
          Host $HOST_ALIAS
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ControlMaster auto
            ControlPath ~/.ssh/cm-%C
            ControlPersist 30m
          EOF
          for attempt in 1 2 3 4 5; do
            if ssh -o BatchMode=yes -o ConnectTimeout=30 -o LogLevel=ERROR "$HOST_ALIAS" true; then
              echo "SSH ready"
              exit 0
            fi
            echo "SSH attempt $attempt failed, retrying..."
            sleep 5
          done
          echo "::error::无法通过 SSH 连接开发服务器"
          exit 1

      - name: Deploy to dev
        working-directory: backend
        run: ./deploy-dev.sh

      - name: Close SSH
        if: always()
        run: |
          ssh -O exit "$HOST_ALIAS" 2>/dev/null || true
          rm -f ~/.ssh/deploy_key
