Name: 追分
Host: 0.0.0.0
Port: ${APP_PORT}
Env: ${APP_ENV}
Timeout: 10000

Middlewares:
  Prometheus: true

# JWT配置
Auth:
  AccessSecret: ${JWT_ACCESS_SECRET}
  AccessExpire: 604800
  RefreshExpire: 2592000

# MySQL配置
MySQL:
  DataSource: ${MYSQL_DSN}

# Redis配置
Redis:
  Host: ${REDIS_HOST}:${REDIS_PORT}
  Password: ${REDIS_PASSWORD}
  DB: 0

# 阿里云短信配置
AliSms:
  AccessKeyId: ${ALI_SMS_ACCESS_KEY_ID}
  AccessKeySecret: ${ALI_SMS_ACCESS_KEY_SECRET}
  SignName: 上海点早早互联网络科技
  TemplateCode: SMS_482815537
  Endpoint: dysmsapi.aliyuncs.com

# 推送配置
UniPush:
  AppId: ${UNIPUSH_APP_ID}
  AppKey: ${UNIPUSH_APP_KEY}
  MasterSecret: ${UNIPUSH_MASTER_SECRET}
  Enabled: false

Qiniu:
  AccessKey: ${QINIU_ACCESS_KEY}
  SecretKey: ${QINIU_SECRET_KEY}
  Bucket: zhuifen
  UploadUrl: https://up-z2.qiniup.com
  PublicDomain: https://cdn.zhuifen.cn

# 支付宝支付配置
Alipay:
  AppId: 2021006105686565
  PrivateKey: ${ALIPAY_PRIVATE_KEY}
  PublicKey: 
  PublicCert: alipayCertPublicKey_RSA2.crt
  AppCert: appCertPublicKey.crt
  RootCert: alipayRootCert.crt
  NotifyUrl: https://api.zhuifen.cn/api/v1/payment/alipay/notify
  ReturnUrl: https://api.zhuifen.cn/payment/return
  Charset: utf-8
  SignType: RSA2

# 微信支付配置
WechatPay:
  AppId: 0
  MchId: 0
  ApiKey: ${WECHAT_API_KEY}
  SerialNo: ${WECHAT_SERIAL_NO}
  ApiV3Key: ${WECHAT_API_V3_KEY}
  PrivateKey: ${WECHAT_PRIVATE_KEY}
  NotifyUrl: https://api.zhuifen.cn/api/v1/payment/wechat/notify

# 微信小程序登录配置
WechatMiniProgram:
  AppId: "wx3196c9366b3b39ba"
  AppSecret: ${WECHAT_MINI_PROGRAM_APP_SECRET}
  RequestTimeoutMs: 5000
  MessagePushToken: ${WECHAT_MINI_MESSAGE_PUSH_TOKEN}
  MessagePushEncodingAESKey: ${WECHAT_MINI_MESSAGE_PUSH_ENCODING_AES_KEY}

Security:
  HTTPAllowedOrigins: https://www.zhuifen.cn,https://api.zhuifen.cn,https://ws.zhuifen.cn
  WebSocketAllowedOrigins: https://www.zhuifen.cn,https://api.zhuifen.cn,https://ws.zhuifen.cn,https://dev-api.kekemate.cn
  AllowNativeMissingOrigin: true
  HuaweiOAuth:
    Enabled: false
    ClientID: "6917600900395032152"
    ClientSecret: ${HUAWEI_OAUTH_CLIENT_SECRET}
    VerifyURL: https://oauth-login.cloud.huawei.com/oauth2/v3/tokeninfo
    RequestTimeoutMs: 5000
  MatchInvite:
    SigningSecret: ${MATCH_INVITE_SIGNING_SECRET}
    TTLSeconds: 300

Geocode:
  WorkerEnabled: true
  PollIntervalMs: 3000
  RequestTimeoutMs: 5000
  MaxAttempts: 5
  BatchSize: 5
  AutoPublish: true
  EncryptSecret: ${GEOCODE_ENCRYPT_SECRET}

WSTSync:
  Enabled: true
  IntervalMinutes: 720
  LookbackDays: 30
  LookaheadDays: 7
  Publish: true
  HotEnabled: true
  HotIntervalMinutes: 15
  HotLookbackDays: 2
  HotLookaheadDays: 7

SeasonLifecycle:
  Enabled: true
  AnchorDate: "2026-08-01"
  InitialNumber: 1
  CycleMonths: 1
  Timezone: Asia/Shanghai

Observability:
  SlowSQLThresholdMs: 500

# 读模型表创建后先保持双写和历史回建；仅在审计 differences=0 后切换为 enabled。
CompetitiveReadModel:
  ReadMode: disabled

Log:
  ServiceName: chasing_points-api
  Encoding: json
  Mode: file
  Level: debug
  Path: tmp/logs
  Rotation: daily
  KeepDays: 7
