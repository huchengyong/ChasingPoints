<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>追分 · 荣誉墙与赛季成就方案</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #ebe8df;
      color: #0f172a;
    }

    * {
      box-sizing: border-box;
    }

    button {
      font: inherit;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(circle at 18% 12%, rgba(224, 174, 18, 0.2), transparent 24%),
        radial-gradient(circle at 82% 88%, rgba(60, 43, 8, 0.12), transparent 28%),
        #ebe8df;
    }

    .preview {
      width: min(900px, calc(100vw - 32px));
      display: grid;
      grid-template-columns: 238px minmax(0, 406px);
      align-items: center;
      justify-content: center;
      gap: 28px;
    }

    .scenario-panel {
      padding: 18px;
      border: 1px solid rgba(107, 90, 46, 0.14);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.66);
      box-shadow: 0 18px 50px rgba(60, 43, 8, 0.1);
      backdrop-filter: blur(18px);
    }

    .scenario-kicker {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #9a7414;
    }

    .scenario-heading {
      margin: 7px 0 5px;
      font-size: 21px;
      line-height: 1.28;
    }

    .scenario-intro,
    .scenario-description {
      margin: 0;
      font-size: 12px;
      line-height: 1.65;
      color: #64748b;
    }

    .scenario-list {
      margin-top: 16px;
      display: grid;
      gap: 7px;
    }

    .scenario-button {
      width: 100%;
      min-height: 42px;
      padding: 0 12px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.76);
      color: #334155;
      font-size: 12px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .scenario-button:hover {
      border-color: rgba(224, 174, 18, 0.42);
      transform: translateY(-1px);
    }

    .scenario-button.active {
      border-color: rgba(224, 174, 18, 0.5);
      background: linear-gradient(135deg, #fff8df, #ffffff);
      color: #805b08;
      box-shadow: 0 7px 18px rgba(224, 174, 18, 0.13);
    }

    .scenario-summary {
      margin-top: 15px;
      padding-top: 14px;
      border-top: 1px solid rgba(148, 163, 184, 0.16);
    }

    .scenario-current {
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: 800;
    }

    .preview-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .preview-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #6b5a2e;
    }

    .phone {
      width: min(406px, calc(100vw - 32px));
      height: min(878px, calc(100vh - 82px));
      min-height: 690px;
      padding: 9px;
      border-radius: 44px;
      background: #17140d;
      box-shadow:
        0 34px 80px rgba(45, 33, 7, 0.25),
        0 5px 18px rgba(15, 23, 42, 0.14);
    }

    .screen {
      position: relative;
      height: 100%;
      overflow: hidden;
      border-radius: 36px;
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
    }

    .status-bar {
      height: 29px;
      padding: 8px 21px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      background: #ffffff;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .signal {
      display: flex;
      align-items: flex-end;
      gap: 1.5px;
      height: 10px;
    }

    .signal i {
      display: block;
      width: 2px;
      border-radius: 2px;
      background: #111827;
    }

    .signal i:nth-child(1) { height: 4px; }
    .signal i:nth-child(2) { height: 6px; }
    .signal i:nth-child(3) { height: 8px; }
    .signal i:nth-child(4) { height: 10px; }

    .wifi {
      width: 12px;
      height: 9px;
      border: 2px solid #111827;
      border-right-color: transparent;
      border-bottom: 0;
      border-left-color: transparent;
      border-radius: 50% 50% 0 0;
      transform: translateY(1px);
    }

    .battery {
      position: relative;
      width: 20px;
      height: 10px;
      padding: 1px;
      border: 1.5px solid #111827;
      border-radius: 3px;
    }

    .battery::before {
      content: "";
      display: block;
      width: 13px;
      height: 100%;
      border-radius: 1px;
      background: #111827;
    }

    .battery::after {
      content: "";
      position: absolute;
      top: 2px;
      right: -3px;
      width: 2px;
      height: 5px;
      border-radius: 0 2px 2px 0;
      background: #111827;
    }

    .nav {
      position: relative;
      height: 48px;
      display: grid;
      place-items: center;
      border-bottom: 1px solid rgba(148, 163, 184, 0.13);
      background: #ffffff;
      font-size: 17px;
      font-weight: 700;
    }

    .nav-back {
      position: absolute;
      top: 50%;
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 0;
      background: transparent;
      color: #475569;
      transform: translateY(-50%);
    }

    .nav-back { left: 12px; }

    .nav svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .content {
      position: absolute;
      inset: 77px 0 11px;
      overflow-y: auto;
      scrollbar-width: none;
      padding: 12px 12px 28px;
    }

    .content::-webkit-scrollbar {
      display: none;
    }

    [hidden] {
      display: none !important;
    }

    .honor-hero {
      position: relative;
      padding: 17px 16px 15px;
      overflow: hidden;
      border-radius: 18px;
      color: #ffffff;
      background:
        radial-gradient(circle at 10% 2%, rgba(255, 241, 191, 0.22), transparent 25%),
        radial-gradient(circle at 96% 4%, rgba(255, 255, 255, 0.15), transparent 30%),
        linear-gradient(135deg, #3c2b08 0%, #8f6507 48%, #c69200 100%);
      box-shadow: 0 14px 28px rgba(60, 43, 8, 0.2);
    }

    .honor-hero::after {
      content: "";
      position: absolute;
      right: -30px;
      bottom: -42px;
      width: 130px;
      height: 130px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 50%;
    }

    .hero-main {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hero-medal {
      width: 58px;
      height: 58px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.13);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.13);
    }

    .hero-medal svg {
      width: 31px;
      height: 31px;
      fill: none;
      stroke: #ffe7a0;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.7;
    }

    .hero-copy {
      min-width: 0;
      flex: 1;
    }

    .hero-eyebrow {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.68);
    }

    .hero-title {
      margin-top: 4px;
      overflow: hidden;
      font-size: 22px;
      font-weight: 850;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hero-meta {
      margin-top: 5px;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.76);
    }

    .hero-stats {
      position: relative;
      z-index: 1;
      margin-top: 15px;
      padding-top: 13px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }

    .hero-stat {
      position: relative;
      text-align: center;
    }

    .hero-stat + .hero-stat::before {
      content: "";
      position: absolute;
      top: 3px;
      bottom: 3px;
      left: 0;
      width: 1px;
      background: rgba(255, 255, 255, 0.14);
    }

    .hero-stat strong,
    .hero-stat span {
      display: block;
    }

    .hero-stat strong {
      font-size: 16px;
      line-height: 1.1;
    }

    .hero-stat span {
      margin-top: 4px;
      font-size: 9px;
      color: rgba(255, 255, 255, 0.7);
    }

    .honor-tabs {
      margin-top: 11px;
      padding: 4px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 5px 14px rgba(15, 23, 42, 0.05);
    }

    .honor-tab {
      min-height: 34px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: #64748b;
      font-size: 10px;
      font-weight: 700;
    }

    .honor-tab.active {
      background: linear-gradient(135deg, #e0ae12, #c69200);
      color: #ffffff;
      box-shadow: 0 5px 12px rgba(224, 174, 18, 0.18);
    }

    .card {
      margin-top: 11px;
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 16px;
      background: #ffffff;
    }

    .section-heading {
      padding: 13px 14px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .section-heading strong {
      font-size: 13px;
      font-weight: 800;
    }

    .section-heading span {
      font-size: 10px;
      color: #94a3b8;
    }

    .showcase-grid {
      padding: 12px 10px 14px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
    }

    .showcase-item {
      min-width: 0;
      padding: 12px 5px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      border-radius: 13px;
      background: #f8fafc;
      text-align: center;
    }

    .showcase-item:nth-child(1) { background: #fff8df; }
    .showcase-item:nth-child(2) { background: #f3f0ff; }
    .showcase-item:nth-child(3) { background: #eef8f5; }

    .showcase-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 5px 12px rgba(15, 23, 42, 0.07);
    }

    .showcase-item:nth-child(1) .showcase-icon { color: #b77908; }
    .showcase-item:nth-child(2) .showcase-icon { color: #7c3aed; }
    .showcase-item:nth-child(3) .showcase-icon { color: #0f766e; }

    .showcase-icon svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .showcase-item strong {
      overflow: hidden;
      max-width: 100%;
      font-size: 10px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .showcase-item span {
      font-size: 8px;
      color: #94a3b8;
    }

    .progress-list,
    .season-list,
    .history-list,
    .rule-list,
    .current-list {
      padding: 7px 14px 11px;
    }

    .progress-row,
    .season-row,
    .history-row,
    .rule-row,
    .current-row {
      display: grid;
      align-items: center;
      border-bottom: 1px solid #f1f5f9;
    }

    .progress-row:last-child,
    .season-row:last-child,
    .history-row:last-child,
    .rule-row:last-child,
    .current-row:last-child {
      border-bottom: 0;
    }

    .progress-row,
    .season-row {
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 10px;
      padding: 11px 0;
    }

    .progress-icon,
    .season-icon,
    .history-icon,
    .rule-icon,
    .current-icon {
      display: grid;
      place-items: center;
      border-radius: 12px;
    }

    .progress-icon,
    .season-icon {
      width: 38px;
      height: 38px;
      background: rgba(224, 174, 18, 0.12);
      color: #b77908;
    }

    .progress-icon svg,
    .season-icon svg,
    .history-icon svg,
    .rule-icon svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .progress-copy,
    .season-copy {
      min-width: 0;
    }

    .progress-head,
    .season-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 11px;
      font-weight: 800;
    }

    .progress-track {
      height: 7px;
      margin-top: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: #eef2f7;
    }

    .progress-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #e0ae12, #f2c94c);
    }

    .progress-note,
    .season-note {
      margin-top: 5px;
      font-size: 9px;
      color: #94a3b8;
    }

    .season-banner {
      margin-top: 11px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid rgba(224, 174, 18, 0.28);
      border-radius: 16px;
      background:
        radial-gradient(circle at 96% 0%, rgba(224, 174, 18, 0.13), transparent 42%),
        linear-gradient(135deg, #fffbef, #ffffff);
    }

    .season-banner-copy strong,
    .season-banner-copy span {
      display: block;
    }

    .season-banner-copy strong {
      font-size: 14px;
    }

    .season-banner-copy span {
      margin-top: 5px;
      font-size: 10px;
      color: #64748b;
    }

    .season-days {
      min-width: 66px;
      padding: 8px 9px;
      border-radius: 11px;
      background: #fff4c7;
      color: #8a6309;
      font-size: 10px;
      font-weight: 800;
      text-align: center;
    }

    .game-tabs {
      margin-top: 10px;
      padding: 4px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 4px;
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 13px;
      background: #ffffff;
    }

    .game-tab {
      min-width: 0;
      padding: 8px 3px;
      border-radius: 9px;
      color: #64748b;
      font-size: 8px;
      font-weight: 700;
      text-align: center;
    }

    .game-tab.active {
      background: #fff4c7;
      color: #805b08;
    }

    .season-footnote {
      padding: 0 14px 13px;
      font-size: 9px;
      line-height: 1.55;
      color: #94a3b8;
    }

    .season-row:nth-child(2) .season-icon {
      background: rgba(59, 130, 246, 0.11);
      color: #2563eb;
    }

    .season-row:nth-child(3) .season-icon {
      background: rgba(139, 92, 246, 0.11);
      color: #7c3aed;
    }

    .history-row {
      grid-template-columns: 42px minmax(0, 1fr) auto;
      gap: 10px;
      padding: 12px 0;
    }

    .history-icon {
      width: 42px;
      height: 42px;
      background: #fff8df;
      color: #b77908;
    }

    .history-row:nth-child(2) .history-icon {
      background: #f3f0ff;
      color: #7c3aed;
    }

    .history-row:nth-child(3) .history-icon {
      background: #eef8f5;
      color: #0f766e;
    }

    .history-copy {
      min-width: 0;
    }

    .history-copy strong,
    .history-copy span {
      display: block;
    }

    .history-copy strong {
      overflow: hidden;
      font-size: 11px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-copy span {
      margin-top: 5px;
      font-size: 9px;
      color: #94a3b8;
    }

    .history-tag,
    .rule-tag {
      padding: 5px 8px;
      border-radius: 999px;
      background: #fff5cf;
      color: #8a6309;
      font-size: 9px;
      font-weight: 800;
      white-space: nowrap;
    }

    .rollover-notice {
      margin-top: 11px;
      padding: 18px 16px;
      border-radius: 18px;
      color: #ffffff;
      background:
        radial-gradient(circle at 90% 10%, rgba(255, 255, 255, 0.16), transparent 32%),
        linear-gradient(135deg, #3c2b08, #9a7414 62%, #c69200);
      box-shadow: 0 14px 28px rgba(60, 43, 8, 0.18);
      text-align: center;
    }

    .rollover-icon {
      width: 46px;
      height: 46px;
      margin: 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.12);
    }

    .rollover-icon svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: #ffe6a0;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .rollover-kicker {
      margin-top: 12px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #ffe6a0;
    }

    .rollover-title {
      margin-top: 6px;
      font-size: 19px;
      font-weight: 850;
    }

    .rollover-desc {
      margin: 7px auto 0;
      max-width: 280px;
      font-size: 10px;
      line-height: 1.55;
      color: rgba(255, 255, 255, 0.76);
    }

    .rollover-status {
      margin-top: 13px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .rollover-status span {
      display: block;
      padding: 9px 7px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.09);
      font-size: 9px;
      font-weight: 700;
    }

    .rollover-read-hint {
      margin-top: 10px;
      font-size: 9px;
      color: #94a3b8;
      text-align: center;
    }

    .rule-row {
      grid-template-columns: 40px minmax(0, 1fr) auto;
      gap: 10px;
      padding: 11px 0;
    }

    .rule-icon {
      width: 40px;
      height: 40px;
      background: #fff8df;
      color: #b77908;
    }

    .rule-row:nth-child(2) .rule-icon {
      background: #eef6ff;
      color: #2563eb;
    }

    .rule-row:nth-child(3) .rule-icon {
      background: #f3f0ff;
      color: #7c3aed;
    }

    .rule-row:nth-child(4) .rule-icon {
      background: #eef8f5;
      color: #0f766e;
    }

    .rule-row.rule-career .rule-icon {
      background: #eef8f5;
      color: #0f766e;
    }

    .rule-row.rule-archive .rule-icon {
      background: #f3f0ff;
      color: #7c3aed;
    }

    .rule-row.rule-award .rule-icon {
      background: #fff8df;
      color: #b77908;
    }

    .rule-row.rule-new-season .rule-icon {
      background: #eef6ff;
      color: #2563eb;
    }

    .rule-copy strong,
    .rule-copy span {
      display: block;
    }

    .rule-copy strong {
      font-size: 11px;
    }

    .rule-copy span {
      margin-top: 4px;
      font-size: 9px;
      color: #94a3b8;
    }

    .rule-tag.new {
      background: #eef6ff;
      color: #2563eb;
    }

    .rule-tag.archive {
      background: #f3f0ff;
      color: #7c3aed;
    }

    .rule-tag.keep {
      background: #eef8f5;
      color: #0f766e;
    }

    .current-title-bar {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 18px;
      color: #ffffff;
      background: linear-gradient(135deg, #e0ae12, #f59e0b);
      box-shadow: 0 10px 24px rgba(224, 174, 18, 0.2);
    }

    .current-title-bar span,
    .current-title-bar strong {
      display: block;
    }

    .current-title-bar span {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.78);
    }

    .current-title-bar strong {
      margin-top: 5px;
      font-size: 18px;
    }

    .current-section {
      margin-top: 15px;
    }

    .current-section-head {
      margin-bottom: 8px;
      padding: 0 3px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .current-section-head strong {
      font-size: 13px;
    }

    .current-section-head span {
      font-size: 10px;
      color: #94a3b8;
    }

    .current-list {
      padding-top: 0;
      padding-bottom: 0;
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 16px;
      background: #ffffff;
    }

      </section>
      <section class="card">
        <div class="section-heading"><strong>本次结算结果</strong><span>所有历史仍保留</span></div>
        <div class="rule-list">
          <div class="rule-row rule-career"><div class="rule-icon">${icons.infinity}</div><div class="rule-copy"><strong>生涯成就 · 43 / 100 胜</strong><span>跨赛季继续累计</span></div><div class="rule-tag keep">已保留</div></div>
          <div class="rule-row rule-archive"><div class="rule-icon">${icons.archive}</div><div class="rule-copy"><strong>S3 挑战 · 7 / 10 胜</strong><span>旧进度冻结为只读记录</span></div><div class="rule-tag archive">已归档</div></div>
          <div class="rule-row rule-award"><div class="rule-icon">${icons.crown}</div><div class="rule-copy"><strong>S3 赛季荣誉 · 1 枚</strong><span>结算称号已进入历届荣誉</span></div><div class="rule-tag">已发放</div></div>
          <div class="rule-row rule-new-season"><div class="rule-icon">${icons.refresh}</div><div class="rule-copy"><strong>S4 三项挑战 · 从零开始</strong><span>按新赛季与球种创建独立进度</span></div><div class="rule-tag new">已开始</div></div>
        </div>
      </section>
      <div class="rollover-read-hint">本通知展示后自动标记已读，同一次换季不会重复弹出</div>
    `

    const renderUnlock = () => `
      <section class="result-summary">
        <div class="result-eyebrow">中式八球 · 比赛已结束</div>
        <div class="result-score"><strong>7</strong><span>胜利</span><strong>4</strong></div>
        <div class="result-players"><span>我</span><span>球友小林</span></div>
      </section>
      <section class="unlock-card">
        <div class="unlock-badge">${icons.medal}</div>
        <div class="unlock-kicker">新成就解锁</div>
        <div class="unlock-title">十胜起步</div>
        <div class="unlock-desc">由本场首次触发 · 累计赢下 10 场有效比赛</div>
        <div class="unlock-reward">获得称号 · 胜场新星</div>
        <div class="unlock-action">查看荣誉墙 →</div>
      </section>
    `

    const renderers = {
      career: renderCareer,
      friend: renderFriend,
      season: renderSeason,
      history: renderHistory,
      rollover: renderRollover,
      unlock: renderUnlock
    }

    const renderScene = (sceneKey, updateHash = true) => {
      const scenario = scenarios[sceneKey] || scenarios.career
      document.querySelectorAll('.scenario-button').forEach((button) => {
        const active = button.dataset.scene === sceneKey
        button.classList.toggle('active', active)
        button.setAttribute('aria-pressed', String(active))
      })

      elements.current.textContent = scenario.title
      elements.description.textContent = scenario.description
      elements.label.textContent = scenario.label
      elements.navTitle.textContent = scenario.nav
      elements.content.innerHTML = renderers[scenario.view]()
      elements.content.scrollTop = 0

      if (updateHash) history.replaceState(null, '', `#${sceneKey}`)
    }

    document.querySelectorAll('.scenario-button').forEach((button) => {
      button.addEventListener('click', () => renderScene(button.dataset.scene))
    })

    const initialScene = scenarios[location.hash.slice(1)] ? location.hash.slice(1) : 'career'
    renderScene(initialScene, false)
  </script>
</body>
</html>
